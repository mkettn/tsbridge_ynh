#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "tsbridge"
name = "tsbridge"
description.en = "Expose Tailscale tailnet services locally as Unix sockets"

version = "0.0.1~rc1~ynh1"

maintainers = ["mkettn"]

[upstream]
license = "MIT"
website = "https://github.com/mkettn/tsbridge"
admindoc = "https://github.com/mkettn/tsbridge/blob/master/README.md"
code = "https://github.com/mkettn/tsbridge"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = true
disk = "50M"
ram.build = "10M"
ram.runtime = "20M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/tsbridge"
    help.en = "Only used to reach the admin web UI (see the webui question below) -- tsbridge's own traffic never goes through this domain/path."

    [install.webui]
    ask.en = "Enable the admin web UI for viewing bridges?"
    type = "boolean"
    default = false
    help.en = "A read-only page (status + bridge list) for YunoHost admins, served at the domain/path above. Off by default: even read-only, it's a new admin-facing HTTP surface on top of the management socket, which can otherwise only be reached locally over SSH. Can be switched on later from this app's config panel -- the domain/path above is reserved either way so turning it on later doesn't require picking one retroactively."

    [install.ts_hostname]
    ask.en = "Node name on the tailnet"
    type = "string"
    optional = true
    default = ""
    help.en = "The name this node will show up as in the tailnet / Tailscale admin console. Leave empty to use this app's own instance name."

    [install.control_url]
    ask.en = "Control server URL (leave empty for Tailscale's own)"
    type = "url"
    optional = true
    default = ""
    help.en = "Set this only to register against a self-hosted Headscale instance instead of Tailscale's own control server. Must be an absolute https:// URL if set."

    [install.ts_authkey]
    ask.en = "Tailscale (or Headscale) auth key"
    type = "password"
    optional = true
    help.en = "Optional. Leave empty to approve this node interactively via a one-time URL logged on first start (see 'yunohost service log <name>' or the systemd journal). For unattended provisioning, generate a tagged, ACL-scoped auth key instead. Never share this key; it is stored in a dedicated environment file readable only by the tsbridge service account, not in the app's regular settings."

[resources]
    [resources.sources.main]
    extract = false
    rename = "tsbridge"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "tsbridge-.*-linux-amd64$"
    autoupdate.asset.arm64 = "tsbridge-.*-linux-arm64$"

        [resources.sources.main.amd64]
        url = "https://github.com/mkettn/tsbridge/releases/download/v-0.0.1-rc1/tsbridge-v-0.0.1-rc1-linux-amd64"
        sha256 = "8dd6d461cf71106e66e8e0fcc3b80c9de3ed166fb6ba181b97ad12c41758dd7c"

        [resources.sources.main.arm64]
        url = "https://github.com/mkettn/tsbridge/releases/download/v-0.0.1-rc1/tsbridge-v-0.0.1-rc1-linux-arm64"
        sha256 = "49e785324e241f41b42cb783656c5b09a7179a9cd111c218f26020b3a1097993"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.allowed = "admins"
    main.show_tile = true
    # Never let this permission loosen to "all_users" or "visitors" by a
    # later `yunohost user permission update`: even in its current
    # read-only form it fronts the management socket, and a future,
    # fuller version of this UI will be able to create bridges to
    # arbitrary tailnet targets -- admin-only is not just today's default,
    # it's the only sane state for this permission ever.
    main.protected = true
