# Used instead of nginx-disabled.conf when the webui install
# question / config panel toggle is on. Selected by scripts/_common.sh's
# tsbridge_apply_webui(), which picks the template -- there's no
# conditional logic inside this file itself.

# Read-only proxy to the management socket's JSON API. GET only: even
# with webui on, this app doesn't yet expose add/remove/enable/disable
# through the web -- limit_except is a second, nginx-level enforcement
# of that on top of only ever wiring up the static page's own read-only
# API calls, not a statement that the underlying socket is read-only
# (POST/DELETE still work for anyone on the box with local socket
# access, e.g. over SSH -- see doc/ADMIN.md).
location __PATH__/api/ {
    limit_except GET {
        deny all;
    }

    proxy_pass http://unix:/run/__APP__/control.sock:/;
    proxy_set_header Host $host;
}

# The static dashboard itself.
location __PATH__/ {
    alias __INSTALL_DIR__/www/;
    index index.html;
    try_files $uri $uri/ =404;
}
