# Used instead of nginx-webui.conf when the webui install question /
# config panel toggle is off (the default). The domain/path are
# reserved either way (see manifest.toml's install.path help text), so
# this location still needs to exist and answer with something -- a
# 404 here would look like a broken install rather than a deliberate
# choice.
location __PATH__/ {
    default_type text/plain;
    return 200 "tsbridge's admin web UI is disabled on this instance.\nEnable it from this app's config panel in the YunoHost webadmin.\n";
}
